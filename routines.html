<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-wrap items-center gap-4">
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <i class="ph-fill ph-thermometer text-brand-500 text-2xl"></i>
          Routines
        </h1>
        <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Sections">
          <a href="/dashboard" class="px-3 py-1 rounded-md text-slate-600 hover:bg-slate-100">Weather</a>
          <a href="/routines" class="px-3 py-1 rounded-md bg-slate-900 text-white" aria-current="page">Routines</a>
          <a href="/services" class="px-3 py-1 rounded-md text-slate-600 hover:bg-slate-100">Services</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1600px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-4">
    <p class="bg-red-50 text-red-700 px-4 py-3 rounded-lg border border-red-100 text-sm font-medium" id="error" hidden>
      <span id="error-msg"></span>
    </p>

    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5" aria-label="Device">
      <h2 class="text-sm font-semibold text-slate-900">Device</h2>
      <p class="mt-1 text-sm text-slate-500">Saving a new device id restarts thermostat control.</p>
      <form id="device-form" class="mt-3 flex flex-wrap items-end gap-3">
        <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 flex-1 min-w-[16rem]" for="device-id">
          Device id
          <input id="device-id" name="device_id" autocomplete="off" spellcheck="false" required class="px-3 py-1.5 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none font-mono">
        </label>
        <button type="submit" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-lg hover:bg-slate-800">Save device</button>
      </form>
    </section>

    <div id="cards" class="grid grid-cols-1 xl:grid-cols-2 gap-4" aria-label="Routines"></div>
  </main>

  <script src="/routines.js"></script>
</body>
</html>
