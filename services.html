<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-wrap items-center gap-4">
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <i class="ph-fill ph-terminal-window text-brand-500 text-2xl"></i>
          Services
        </h1>
        <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Sections">
          <a href="/dashboard" class="px-3 py-1 rounded-md text-slate-600 hover:bg-slate-100">Weather</a>
          <a href="/services" class="px-3 py-1 rounded-md bg-slate-900 text-white" aria-current="page">Services</a>
        </nav>
        <button type="button" id="settings-open" class="ml-auto p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings-dialog">
          <i class="ph ph-gear text-xl" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-[1600px] mx-auto w-full px-4 sm:px-6 lg:px-8 mt-4">
    <p class="bg-red-50 text-red-700 px-4 py-3 rounded-lg border border-red-100 text-sm font-medium" id="error" hidden>
      <span id="error-msg"></span>
    </p>
  </div>

  <main id="panels" class="flex-1 max-w-[1600px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 xl:grid-cols-2 gap-4" aria-label="Service logs"></main>

  <script src="/settings.js"></script>
  <script src="/services.js"></script>
</body>
</html>
